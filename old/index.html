<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ネコギルド</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="header" class="header card">
      <div id="title" class="title">🐱 ネコギルド</div>
      <div class="headerRow">
        <div id="gold" class="gold">💰 0G</div>
        <div id="status" class="status">🟢 待機中</div>
      </div>
    </div>

    <section id="questsSection" class="section">
      <div id="questsTitle" class="sectionTitle">今日のクエスト</div>
      <div id="quests" class="stack"></div>
    </section>

    <section id="catsSection" class="section">
      <div id="catsTitle" class="sectionTitle">編成ネコ</div>
      <div id="cats" class="stack"></div>
    </section>

    <div id="synergy" class="synergy card">🤝 相性：なし</div>

    <section id="logSection" class="section">
      <div id="logTitle" class="sectionTitle">ログ</div>
      <div id="log" class="log card"></div>
    </section>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
